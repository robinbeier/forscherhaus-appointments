services:
    php-fpm:
        build: docker/php-fpm
        working_dir: /var/www/html
        environment:
            - EA_SKIP_NPM_BOOTSTRAP=${EA_SKIP_NPM_BOOTSTRAP:-0}
            - EA_SKIP_ASSET_BUILD_BOOTSTRAP=${EA_SKIP_ASSET_BUILD_BOOTSTRAP:-0}
            - PDF_TOKEN
            - LDAPTLS_CACERT=/run/secrets/ldap-ca/ca.crt
        extra_hosts:
            - host.docker.internal:host-gateway
        volumes:
            - '.:/var/www/html'
            - './docker/php-fpm/php-ini-overrides.ini:/usr/local/etc/php/conf.d/99-overrides.ini'
            - ldap_tls_ca:/run/secrets/ldap-ca:ro
            - type: volume
              source: php_fpm_sessions
              target: /var/www/html/storage/sessions
              volume:
                  nocopy: true

    nginx:
        image: 'nginx:1.29.6-alpine'
        depends_on:
            - php-fpm
        working_dir: /var/www/html
        volumes:
            - '.:/var/www/html'
            - './docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf'
        ports:
            - '127.0.0.1:80:80'

    mysql:
        image: 'mysql:8.4.8'
        volumes:
            - '${EA_MYSQL_DATA_PATH:-./docker/mysql}:/var/lib/mysql'
        environment:
            - MYSQL_ROOT_PASSWORD=secret
            - MYSQL_DATABASE=easyappointments
            - MYSQL_USER=user
            - MYSQL_PASSWORD=password
        ports:
            - '127.0.0.1:3306:3306'

    phpmyadmin:
        image: 'phpmyadmin:5.2.3'
        ports:
            - '127.0.0.1:8080:80'
        environment:
            - 'PMA_HOST=mysql'
            - 'UPLOAD_LIMIT=102400K'

    swagger-ui:
        platform: linux/amd64
        image: swaggerapi/swagger-ui:v5.32.0
        ports:
            - '8000:8080'
        volumes:
            - ./openapi.yml:/usr/share/nginx/html/openapi.yml
        environment:
            API_URL: openapi.yml

    openldap:
        image: vegardit/openldap@sha256:efa7cff027fa2ac503b073161849f93e4ccaaa1b9ac0a9788814865032952564
        hostname: openldap
        depends_on:
            ldap-tls-init:
                condition: service_completed_successfully
        ports:
            - '127.0.0.1:389:389'
            - '127.0.0.1:636:636'
        volumes:
            - ./docker/ldap/vegardit/init_org_tree.ldif:/opt/ldifs/init_org_tree.ldif:ro
            - ./docker/ldap/vegardit/init_org_entries.ldif:/opt/ldifs/init_org_entries.ldif:ro
            - ./docker/openldap/var:/var/lib/ldap
            - ./docker/openldap/etc:/etc/ldap/slapd.d
            - ldap_tls_ca:/run/secrets/ldap-ca:ro
            - ldap_tls_server:/run/secrets/ldap-server:ro
        environment:
            - LDAP_INIT_ORG_DN=dc=example,dc=org
            - LDAP_INIT_ORG_NAME=example
            - LDAP_INIT_ROOT_USER_DN=cn=admin,dc=example,dc=org
            - LDAP_INIT_ROOT_USER_PW=admin
            - LDAP_TLS_ENABLED=true
            - LDAP_LDAPS_ENABLED=true
            - LDAP_TLS_CERT_FILE=/run/secrets/ldap-server/server.crt
            - LDAP_TLS_KEY_FILE=/run/secrets/ldap-server/server.key
            - LDAP_TLS_CA_FILE=/run/secrets/ldap-ca/ca.crt
            - LDAP_TLS_SSF=128
            - LDAPTLS_CACERT=/run/secrets/ldap-ca/ca.crt
            - LDAPTLS_REQCERT=demand

    ldap-tls-init:
        image: php:8.4.27-cli-bookworm
        command:
            - bash
            - -ec
            - |
                if [[ -s /run/secrets/ldap-ca/ca.crt && -s /run/secrets/ldap-server/server.crt && -s /run/secrets/ldap-server/server.key ]] \
                    && openssl x509 -checkend 2592000 -noout -in /run/secrets/ldap-ca/ca.crt \
                    && openssl x509 -checkend 2592000 -noout -in /run/secrets/ldap-server/server.crt; then
                    chmod 0644 /run/secrets/ldap-ca/ca.crt /run/secrets/ldap-server/server.crt
                    chmod 0600 /run/secrets/ldap-server/server.key
                    exit 0
                fi
                umask 077
                rm -f /run/secrets/ldap-ca/* /run/secrets/ldap-server/*
                openssl req -x509 -newkey rsa:2048 -nodes -days 365 -keyout /run/secrets/ldap-ca/ca.key -out /run/secrets/ldap-ca/ca.crt -subj '/CN=Forscherhaus LDAP fixture CA'
                openssl req -newkey rsa:2048 -nodes -keyout /run/secrets/ldap-server/server.key -out /run/secrets/ldap-server/server.csr -subj '/CN=openldap'
                printf '%s\n' '[v3_req]' 'subjectAltName=DNS:openldap,DNS:localhost,IP:127.0.0.1' > /tmp/ldap-ext.cnf
                openssl x509 -req -in /run/secrets/ldap-server/server.csr -CA /run/secrets/ldap-ca/ca.crt -CAkey /run/secrets/ldap-ca/ca.key -CAcreateserial -out /run/secrets/ldap-server/server.crt -days 365 -sha256 -extfile /tmp/ldap-ext.cnf -extensions v3_req
                rm -f /run/secrets/ldap-ca/ca.key /run/secrets/ldap-server/server.csr /run/secrets/ldap-ca/ca.srl /tmp/ldap-ext.cnf
                chmod 0644 /run/secrets/ldap-ca/ca.crt /run/secrets/ldap-server/server.crt
                chmod 0600 /run/secrets/ldap-server/server.key
                openssl x509 -checkend 2592000 -noout -in /run/secrets/ldap-ca/ca.crt
                openssl x509 -checkend 2592000 -noout -in /run/secrets/ldap-server/server.crt
        volumes:
            - ldap_tls_ca:/run/secrets/ldap-ca
            - ldap_tls_server:/run/secrets/ldap-server

    pdf-renderer:
        platform: linux/amd64
        build: ./pdf-renderer
        init: true
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        read_only: true
        tmpfs:
            - /tmp:size=512m,mode=1777
        mem_limit: 1g
        memswap_limit: 1536m
        pids_limit: 512
        logging:
            driver: json-file
            options:
                max-size: 10m
                max-file: '3'
        environment:
            - NODE_ENV=production
            - PDF_TOKEN
        ports:
            - '127.0.0.1:3003:3000'
        shm_size: '1gb'
        healthcheck:
            test: ['CMD', 'curl', '-fsS', 'http://localhost:3000/healthz']
            interval: 30s
            timeout: 3s
            retries: 3

volumes:
    php_fpm_sessions:
    ldap_tls_ca:
    ldap_tls_server:
