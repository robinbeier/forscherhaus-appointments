services:
    uptime-kuma:
        image: 'louislam/uptime-kuma:2.5.8-slim@sha256:3e0ae13fa92d0a1108b7e4133eaa25b2bc4e26d2f5d8691a5cb01ee1fe5c95f1'
        restart: unless-stopped
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
        security_opt:
            - no-new-privileges:true
        read_only: true
        tmpfs:
            - /tmp:size=64m,mode=1777
        mem_limit: 384m
        memswap_limit: 512m
        pids_limit: 128
        logging:
            driver: json-file
            options:
                max-size: 5m
                max-file: '3'
        ports:
            - '${KUMA_BIND_ADDR:-127.0.0.1}:${KUMA_PORT:-3001}:3001'
        volumes:
            - '${KUMA_DATA_PATH:-uptime-kuma-data}:/app/data'

volumes:
    uptime-kuma-data:
