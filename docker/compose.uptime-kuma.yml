services:
    uptime-kuma:
        image: 'fh-uptime-kuma:2.5.6-node22.23.4'
        build: ./uptime-kuma
        restart: unless-stopped
        ports:
            - '${KUMA_BIND_ADDR:-127.0.0.1}:${KUMA_PORT:-3001}:3001'
        volumes:
            - '${KUMA_DATA_PATH:-uptime-kuma-data}:/app/data'

volumes:
    uptime-kuma-data:
