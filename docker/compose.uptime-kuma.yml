services:
    uptime-kuma:
        image: 'louislam/uptime-kuma:2.5.3-slim@sha256:7d70c3bd3127dc4ad2910f9d2d18481a6ac4f195a4e23e32f0c50869f977985a'
        restart: unless-stopped
        ports:
            - '${KUMA_BIND_ADDR:-127.0.0.1}:${KUMA_PORT:-3001}:3001'
        volumes:
            - '${KUMA_DATA_PATH:-uptime-kuma-data}:/app/data'

volumes:
    uptime-kuma-data:
