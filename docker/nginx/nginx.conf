server {
    listen 80 default;
    
    server_name localhost;

    client_max_body_size 128M;

    access_log /var/log/nginx/application.access.log;

    root /var/www/html;
    
    index index.php index.html;
    
    # Default requests go through the application. Never let a newly added
    # extensionless repository file become a directly downloadable web asset.
    location / { rewrite ^ /index.php last; }

    # This development webroot is the entire bind-mounted repository. Keep
    # internal source, local data, and dotfiles inaccessible even when a new
    # file appears there. The two PDF resources are the only public PDF files.
    location ~ /\. { deny all; }
    location ~* ^/(?:application|build|docker|docs|node_modules|pdf-renderer|phpstan|resources|scripts|storage|system|tests|vendor)(?:/|$) { deny all; }
    location ~* ^/pdf/ { deny all; }

    # Route application requests through the sole PHP entry point. Never
    # execute arbitrary PHP files from the repository bind mount.
    location ~ ^/index\.php(?:/|$) {
        fastcgi_pass php-fpm:9000;
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param PHP_VALUE "error_log=/var/log/nginx/application_php_errors.log";
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_index index.php;
        include fastcgi_params;
    }
    location ~* \.php(?:/|$) { deny all; }

    # Only these public paths may be served as static files. Keep this prefix
    # without ^~ so the dotfile and PHP deny rules still take precedence.
    location /assets/ { try_files $uri =404; }
    location = /health { try_files $uri =404; }
    location = /pdf/logo.png { try_files $uri =404; }
    location = /pdf/template.html { try_files $uri =404; }
    location = /logo.png { try_files $uri =404; }
    location = /screenshot.png { try_files $uri =404; }
    location = /LICENSE { deny all; }
    location = /NOTICE { deny all; }
    location ~ ^/[^/]+\.[^/]+$ { deny all; }
}
