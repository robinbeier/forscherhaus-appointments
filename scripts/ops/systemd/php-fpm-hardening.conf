# Install as /etc/systemd/system/php8.5-fpm.service.d/fh-hardening.conf.
# Requires the documented root-owned code / web-owned storage permission policy.
[Service]
NoNewPrivileges=yes
PrivateTmp=yes
ProtectHome=yes
ProtectSystem=strict
# Stable parents are intentional: deploy_ea.sh atomically renames app directories
# then reloads FPM; logrotate renames/recreates the PHP log before reopening it.
# Binding only the current storage directory or log file would pin old inodes.
ReadWritePaths=/var/www/html /run/php /var/log
